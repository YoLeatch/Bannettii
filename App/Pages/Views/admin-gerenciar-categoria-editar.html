<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Categoria - Bennettii</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/admin.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body class="admin-body">
    <div class="admin-container">
        <aside class="admin-sidebar">
            <div class="admin-logo">
                <img src="/assets/image/bennettii_nobackground_horizontal.png" alt="Bennettii Admin">
            </div>

            <nav class="admin-nav">
                <div class="nav-section">
                    <h3>Principal</h3>
                    <a href="/admin/dashboard">
                        Dashboard
                    </a>
                    <a href="/admin/team-list">
                        Equipe
                    </a>
                    <a href="/admin/reports">Relatórios</a>

                </div>

                <div class="nav-section">
                    <h3>Produtos</h3>
                    <a href="/admin/cupons">Cupons
                    </a>
                    <a href="/admin/products">
                        Produtos
                    </a>
                    <a href="/admin/categories" class="active">
                        Categorias
                    </a>
                    <a href="/admin/subcategorias">
                        Subcategorias
                    </a>
                </div>

                <div class="nav-section">
                    <h3>Clientes</h3>
                    <a href="/admin/customers">
                        Clientes
                    </a>
                    <a href="/admin/orders">
                        Pedidos
                    </a>
                    <a href="/admin/reviews">Avaliações</a>
                    <a href="/admin/tickets">Tickets</a>
                </div>

                <div class="nav-section">
                    <h3>Configurações</h3>
                    <a href="/admin/carousel">
                        Carrossel
                    </a>
                    <a href="/admin/sessions">
                        Sessões
                    </a>
                </div>
            </nav>
        </aside>

        <main class="admin-main">
            <div class="page-content">
                <div class="admin-profile">
                    <div class="admin-profile-card">
                        <div class="admin-pfp">{admin_avatar}</div>
                        <div class="admin-profile-info">
                            <h2 id="admin-profile-name">{admin_name}</h2>
                            <h4 id="admin-profile-role">{admin_role}</h4>
                        </div>
                    </div>
                </div>

                <ul class="breadcrumb" style="margin-bottom: 20px;">
                    <li><a href="/admin/dashboard">Dashboard</a></li>
                    <li><a href="/admin/categories">Categorias</a></li>
                    <li class="active">Editar</li>
                </ul>
                <br>

                <form action="/admin/categories/{category_id}/update" method="POST">
                    <div class="page-header">
                        <div class="title-area">
                            <a href="/admin/categories" class="btn-back">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round">
                                    <path d="M19 12H5M12 19l-7-7 7-7" />
                                </svg>
                            </a>
                            <h1>Editar Categoria</h1>
                        </div>
                        <div class="actions-area">
                            <button type="submit" class="btn-add">Salvar Alterações</button>
                        </div>
                    </div>

                    <div class="card">
                        <h2>Informações da Categoria</h2>
                        <div class="form-group">
                            <label>Nome da Categoria</label>
                            <input type="text" name="categoria" value="{categoria}" required
                                placeholder="Ex: Camisetas">
                        </div>
                    </div>
                </form>
            </div>
        </main>
    </div>
</body>

</html>
