<body class="admin-body">
    <div class="admin-container">
        <!-- Admin Sidebar -->
        <aside class="admin-sidebar">
            <div class="admin-logo">
                <img src="/assets/image/bennettii_nobackground_horizontal.png" alt="Bennettii Admin">
            </div>

            <nav class="admin-nav">
                <div class="nav-section">
                    <h3>Principal</h3>
                    <a href="/admin/dashboard" class="active">
                        Dashboard
                    </a>
                </div>

                <div class="nav-section">
                    <h3>Gestão de Conteúdo</h3>
                    <a href="/admin/carousel">
                        Carrossel
                    </a>
                    <a href="/admin/promotions">
                        Promoções
                    </a>
                    <a href="/admin/news">
                        Novidades
                    </a>
                    <a href="/admin/bestsellers">

                    </a>
                    <a href="/admin/settings">
                        Configurações (Logo/Menu)

                    </a>

                    </a>

                    <h3>Vendas & Relatórios</h3>
                    <a href="/admin/orders">
                        Pedidos
                    </a>
                    <a href="/admin/reports">

                    </a>

                    <a href="/admin/reviews">

                    </a>

            <div class="page-content">

                    <div class="admin-profile-card">
                        <img src="./assets/image/placeholder_pfp.png" class="admin-pfp">
                        <div class="admin-profile-info">
                            <h2 id="admin-profile-name">{admin_name}</h2>
                            <h4 id="admin-profile-role">{admin_role}</h4>
                        </div>
                    </div>
                </div>

                <ul class="breadcrumb" style="margin-bottom: 20px;">
                    <li><a href="/admin/dashboard">Dashboard</a></li>
                    <li class="active"><a href="/admin/logs">Logs</a></li>

                <input type="file">
