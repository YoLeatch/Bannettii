<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/image/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/image/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/image/favicon-16x16.png">
    <link rel="stylesheet" href="/css/style.css">
    <script src="/assets/js/script.js"></script>
    <title>Catálogo - Bennettii</title>
</head>

<body>
    <!-- Header -->
    <header class="main-header">
        <div class="header-content">
            <div class="logo">
                <a href="/">
                    <img height="50px" src="/assets/image/bennettii_nobackground_horizontal.png" alt="Bennettii Logo">
                </a>
            </div>
            <div>
                <form>
                    <input type="search" class="barraPesquisa" placeholder="Buscar produtos...">
                </form>
            </div>

            <div class="menu-trigger" id="menuTrigger">
                <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px"
                    fill="#D0D558">
                    <path d="M120-240v-80h720v80H120Zm0-200v-80h720v80H120Zm0-200v-80h720v80H120Z" />
                </svg>
            </div>
        </div>
    </header>
    <div class="lower-header">
        <a href="/catalog?category=camisetas">Camisetas</a>
        <a href="/catalog?category=calcas">Calças</a>
        <a href="/catalog?category=blusas">Blusas e Jaquetas</a>
        <a href="/catalog?category=bolsas">Bolsas</a>
    </div>

    <!-- Sidebar Navigation -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <button id="closeSidebar" class="close-btn">&times;</button>
        </div>
        <nav class="sidebar-nav">
            <div class="nav-group">
                <a href="/profile" class="nav-item">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                    Gerenciar Conta
                </a>
                <a href="/orders" class="nav-item">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
                        <line x1="3" y1="6" x2="21" y2="6"></line>
                        <path d="M16 10a4 4 0 0 1-8 0"></path>
                    </svg>
                    Meus Pedidos
                </a>
                <a href="/addresses" class="nav-item">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                        <circle cx="12" cy="10" r="3"></circle>
                    </svg>
                    Endereços de Entrega
                </a>
                <a href="/payments" class="nav-item">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="1" y="4" width="22" height="16" rx="2" ry="2"></rect>
                        <line x1="1" y1="10" x2="23" y2="10"></line>
                    </svg>
                    Formas de Pagamento
                </a>
                <a href="/wishlist" class="nav-item">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path
                            d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z">
                        </path>
                    </svg>
                    Lista de Desejos
                </a>
                <a href="/help" class="nav-item">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"></circle>
                        <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
                        <line x1="12" y1="17" x2="12.01" y2="17"></line>
                    </svg>
                    Central de Ajuda
                </a>
                <a href="/profile" class="nav-item">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                    Criar conta/Entrar
                </a>
            </div>
            <div class="nav-footer">
                <a href="/logout" class="logout-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                        <polyline points="16 17 21 12 16 7"></polyline>
                        <line x1="21" y1="12" x2="9" y2="12"></line>
                    </svg>
                    Sair
                </a>
            </div>
        </nav>
    </aside>
    <div class="overlay" id="overlay"></div>

    <main>
        <div>
            <div class="catalog-container">
                <!-- Filters Sidebar -->
                <aside class="catalog-filters">
                    <div class="filter-header">
                        <h3>Filtros</h3>
                        <button class="clear-filters">Limpar</button>
                    </div>

                    <div class="filter-group">
                        <h4>Categorias</h4>
                        <label class="filter-option">
                            <input type="checkbox" name="category" value="camisetas">
                            <span>Camisetas</span>
                        </label>
                        <label class="filter-option">
                            <input type="checkbox" name="category" value="calcas">
                            <span>Calças</span>
                        </label>
                        <label class="filter-option">
                            <input type="checkbox" name="category" value="vestidos">
                            <span>Vestidos</span>
                        </label>
                        <label class="filter-option">
                            <input type="checkbox" name="category" value="acessorios">
                            <span>Acessórios</span>
                        </label>
                    </div>

                    <div class="filter-group">
                        <h4>Preço</h4>
                        <div class="price-range">
                            <input type="number" placeholder="Min" min="0">
                            <span>-</span>
                            <input type="number" placeholder="Max" min="0">
                        </div>
                    </div>

                    <div class="filter-group">
                        <h4>Tamanho</h4>
                        <div class="size-options">
                            <label class="size-box"><input type="checkbox" name="size"
                                    value="xs"><span>XS</span></label>
                            <label class="size-box"><input type="checkbox" name="size" value="s"><span>S</span></label>
                            <label class="size-box"><input type="checkbox" name="size" value="m"><span>M</span></label>
                            <label class="size-box"><input type="checkbox" name="size" value="l"><span>L</span></label>
                            <label class="size-box"><input type="checkbox" name="size"
                                    value="xl"><span>XL</span></label>
                        </div>
                    </div>

                    <div class="filter-group">
                        <h4>Cores</h4>
                        <div class="color-options">
                            <label class="color-circle" style="background-color: #000;"><input type="checkbox"
                                    name="color" value="black"></label>
                            <label class="color-circle" style="background-color: #fff; border: 1px solid #ddd;"><input
                                    type="checkbox" name="color" value="white"></label>
                            <label class="color-circle" style="background-color: #2d4a3e;"><input type="checkbox"
                                    name="color" value="green"></label>
                            <label class="color-circle" style="background-color: #1a237e;"><input type="checkbox"
                                    name="color" value="blue"></label>
                            <label class="color-circle" style="background-color: #b71c1c;"><input type="checkbox"
                                    name="color" value="red"></label>
                        </div>
                    </div>
                </aside>

                <!-- Product Grid -->
                <section class="catalog-content">
                    <div class="catalog-header">
                        <h1>Todos os Produtos</h1>
                        <div class="sort-options">
                            <label>Ordenar por:</label>
                            <select>
                                <option value="relevance">Relevância</option>
                                <option value="price_asc">Menor Preço</option>
                                <option value="price_desc">Maior Preço</option>
                                <h4>Preço</h4>
                                <div class="price-range">
                                    <input type="number" placeholder="Min" min="0">
                                    <span>-</span>
                                    <input type="number" placeholder="Max" min="0">
                                </div>
                        </div>

                        <div class="filter-group">
                            <h4>Tamanho</h4>
                            <div class="size-options">
                                <label class="size-box"><input type="checkbox" name="size"
                                        value="xs"><span>XS</span></label>
                                <label class="size-box"><input type="checkbox" name="size"
                                        value="s"><span>S</span></label>
                                <label class="size-box"><input type="checkbox" name="size"
                                        value="m"><span>M</span></label>
                                <label class="size-box"><input type="checkbox" name="size"
                                        value="l"><span>L</span></label>
                                <label class="size-box"><input type="checkbox" name="size"
                                        value="xl"><span>XL</span></label>
                            </div>
                        </div>

                        <div class="filter-group">
                            <h4>Cores</h4>
                            <div class="color-options">
                                <label class="color-circle" style="background-color: #000;"><input type="checkbox"
                                        name="color" value="black"></label>
                                <label class="color-circle"
                                    style="background-color: #fff; border: 1px solid #ddd;"><input type="checkbox"
                                        name="color" value="white"></label>
                                <label class="color-circle" style="background-color: #2d4a3e;"><input type="checkbox"
                                        name="color" value="green"></label>
                                <label class="color-circle" style="background-color: #1a237e;"><input type="checkbox"
                                        name="color" value="blue"></label>
                                <label class="color-circle" style="background-color: #b71c1c;"><input type="checkbox"
                                        name="color" value="red"></label>
                            </div>
                        </div>
                        </aside>

                        <!-- Product Grid -->
                        <section class="catalog-content">
                            <div class="catalog-header">
                                <h1>Todos os Produtos</h1>
                                <div class="sort-options">
                                    <label>Ordenar por:</label>
                                    <select>
                                        <option value="relevance">Relevância</option>
                                        <option value="price_asc">Menor Preço</option>
                                        <option value="price_desc">Maior Preço</option>
                                        <span>...</span>
                                        <button class="page-btn">Next</button>
                                </div>
                        </section>
                    </div>
            </div>
    </main>

    <footer class="main-footer">
        <div class="container footer-grid">
            <div class="footer-col">
                <h4>Bennettii</h4>
                <p>Conectando você à natureza com qualidade e estilo.</p>
                <div class="social-links">
                    <a href="#">Instagram</a>
                    <a href="#">Facebook</a>
                    <a href="#">Twitter</a>
                </div>
            </div>
            <div class="footer-col">
                <h4>Links Úteis</h4>
                <a href="/about">Sobre Nós</a>
                <a href="/contact">Contato</a>
                <a href="/terms">Termos de Uso</a>
                <a href="/privacy">Política de Privacidade</a>
            </div>
            <div class="footer-col">
                <h4>Contato</h4>
                <p>Email: suporte.contato@bennettii.com.br</p>
                <p>Tel: (11) 99999-9999</p>
            </div>
        </div>
        <div class="footer-bottom">
            <p>&copy; 2025 Bennettii. Todos os direitos reservados.</p>
        </div>
    </footer>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Sidebar Toggle
            const menuTrigger = document.getElementById('menuTrigger');
            const sidebar = document.getElementById('sidebar');
            const closeSidebar = document.getElementById('closeSidebar');
            const overlay = document.getElementById('overlay');

            function toggleSidebar() {
                sidebar.classList.toggle('active');
                overlay.classList.toggle('active');
            }

            if (menuTrigger) menuTrigger.addEventListener('click', toggleSidebar);
            if (closeSidebar) closeSidebar.addEventListener('click', toggleSidebar);
            if (overlay) overlay.addEventListener('click', toggleSidebar);

            // Cookie Consent
            const cookieBanner = document.getElementById('cookieConsent');
            if (!localStorage.getItem('cookiesAccepted')) {
                cookieBanner.classList.add('show');
            }

            const acceptBtn = document.getElementById('acceptCookies');
            if (acceptBtn) {
                acceptBtn.addEventListener('click', () => {
                    localStorage.setItem('cookiesAccepted', 'true');
                    cookieBanner.classList.remove('show');
                });
            }
        });
    </script>
</body>

</html>
