    <main class="special-margin">
        <div id="login-container">

            <div class="login-modal">

                <form method="POST">
                    <center><img src="assets/image/bennettii_nobackground.png" height="120px"><br></center>
                    <br>
                    <h3>Esqueceu sua senha?</h2><br>
                        <h3 class="warning">Não existe nenhuma conta com esse e-mail</h3><br>

                        <label>Email da sua conta</label><br>
                        <input required type="email" name="nome" maxlength="255" placeholder="(Ex.: seunome@email.com)">
                        <br>
                        <input type="hidden" name="csrf_token" value="{csrf_token}">
                        <br>
                        <input required type="submit" class="button" value="Enviar e-mail de recuperação">
                        <br><br>
                        <span class="possuiConta"><a href="/login">Voltar ao login</a></span>
                </form>
            </div>
        </div>
